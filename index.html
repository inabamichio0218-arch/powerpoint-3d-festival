<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>動く3Dワールドを作ったよ！</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06152e;color:#fff;font-family:'Arial Rounded MT Bold','Yu Gothic','Meiryo',system-ui,sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #ffe477;outline-offset:3px}
.stage{position:fixed;inset:0;display:grid;place-items:center}.screen{position:relative;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);overflow:hidden;container-type:size;isolation:isolate;background:#032252}
.menu,.viewer{position:absolute;inset:0}.menu{background:radial-gradient(ellipse at 50% 48%,#1e98e9cc 0%,#0d64b0cc 25%,transparent 64%),radial-gradient(circle at 0% 45%,#06d7b755,transparent 45%),radial-gradient(circle at 100% 36%,#bc45e255,transparent 45%),linear-gradient(115deg,#041434,#063b92 48%,#051a56);overflow:hidden}
.menu:before{content:'';position:absolute;inset:-35%;background:repeating-conic-gradient(from 12deg at 50% 49%,#a5eefe0e 0 7deg,transparent 7deg 21deg,#ffe4630b 21deg 24deg,transparent 24deg 35deg);pointer-events:none}.menu:after{content:'';position:absolute;inset:1.1%;border:1px solid #75c8ff55;border-radius:1.4cqw;box-shadow:inset 0 0 3cqw #17c8fb33;pointer-events:none}
.stars{position:absolute;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle at 5% 30%,#fff 0 .1cqw,transparent .17cqw),radial-gradient(circle at 93% 8%,#ffe27d 0 .17cqw,transparent .23cqw),radial-gradient(circle at 72% 71%,#fff 0 .09cqw,transparent .18cqw),radial-gradient(circle at 24% 62%,#e6efff 0 .13cqw,transparent .2cqw),radial-gradient(circle at 51% 8%,#ffe274 0 .1cqw,transparent .18cqw),radial-gradient(circle at 82% 44%,#aaf2ff 0 .11cqw,transparent .17cqw);filter:drop-shadow(0 0 .6cqw #b5e8ff)}
.grades{position:absolute;inset:0;z-index:3}.grade{position:absolute;left:5%;width:27%;height:31%;border:.17cqw solid var(--accent);border-radius:1.2cqw;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 17%,#08376c 83%),#061946f4);box-shadow:0 0 1.25cqw color-mix(in srgb,var(--accent) 30%,transparent),inset 0 .1cqw .3cqw #ffffff24;display:flex;flex-direction:column;align-items:stretch;padding:.68cqw;gap:.7cqh}
.grade:nth-child(1){left:5%;top:3.7%;--accent:#ffcf4a}.grade:nth-child(2){left:36.5%;top:3.7%;--accent:#6be7ff}.grade:nth-child(3){left:68%;top:3.7%;--accent:#f09af3}.grade:nth-child(4){left:5%;bottom:3.7%;--accent:#74e7b1}.grade:nth-child(5){left:36.5%;bottom:3.7%;--accent:#ffab74}.grade:nth-child(6){left:68%;bottom:3.7%;--accent:#b5a0ff}
.grade-head{height:36%;display:flex;align-items:center;justify-content:center;background:linear-gradient(#fff8,color-mix(in srgb,var(--accent) 88%,#fff 12%)),var(--accent);border-radius:.75cqw;box-shadow:inset 0 .14cqw .2cqw #fff9,0 .25cqw 0 #263f68,0 .4cqw .5cqw #0008;color:#0b234e;font-size:4.05cqw;line-height:1;font-weight:1000;flex:none}
.names{flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;align-items:center;gap:.5cqw .6cqh;min-height:0}.student{font-weight:1000;font-size:2.68cqw;line-height:1.15;color:#fff;text-shadow:0 .1cqw .1cqw #061332;border:.11cqw solid #ffffff50;padding:.35cqh .42cqw;border-radius:.55cqw;background:linear-gradient(180deg,#6783bd80,#183260a8);box-shadow:0 .2cqw .4cqw #0006;white-space:nowrap;min-width:0}.student:hover,.student:focus-visible{background:color-mix(in srgb,var(--accent) 55%,#0c5db7 45%);transform:translateY(-.18cqh);color:#081e45;text-shadow:none}
.grade:nth-child(3) .student,.grade:nth-child(6) .student{font-size:2.28cqw;padding:.28cqh .4cqw}.grade:nth-child(3) .names,.grade:nth-child(6) .names{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(2,auto);gap:.7cqh .32cqw;align-content:center}.grade:nth-child(3) .student,.grade:nth-child(6) .student{grid-column:span 2}.grade:nth-child(3) .student:nth-child(4),.grade:nth-child(6) .student:nth-child(4){grid-column:2/span 2}.grade:nth-child(3) .student:nth-child(5),.grade:nth-child(6) .student:nth-child(5){grid-column:4/span 2}
.hero{position:absolute;top:35.8%;height:28.4%;left:7%;width:86%;display:flex;align-items:center;justify-content:center;z-index:2;pointer-events:none}.title-art{display:block;width:100%;height:100%;object-fit:contain;transform:scale(1.40);transform-origin:center;filter:drop-shadow(0 .7cqw .7cqw #001d4b7a)}
.viewer{display:none;background:#05080f;z-index:5}.viewer.active{display:block}.viewer video{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}.back{position:absolute;z-index:10;left:2.3%;top:2.7%;width:20%;max-height:12%;aspect-ratio:2048/651;background:none;border:0;padding:0;filter:drop-shadow(0 .3cqw .4cqw #0009)}.back img{width:100%;height:100%;object-fit:contain;display:block}.back:hover{filter:drop-shadow(0 0 .8cqw #ffb2db)}
.menu[hidden],.viewer[hidden]{display:none!important}
</style></head>
<body><div class="stage"><main class="screen">
<section class="menu" id="menu"><div class="stars"></div><div class="grades" id="grades"></div><div class="hero"><img src="title.png" alt="動く3Dワールドを作ったよ！" class="title-art"></div></section>
<section class="viewer" id="viewer" hidden><video id="movie" loop muted playsinline preload="metadata"></video><button class="back" id="back" type="button" aria-label="みんなの作品へ"><img src="back.png" alt="みんなの作品へ"></button></section>
</main></div><script>
'use strict';
const students=[{"grade":1,"name":"有留","file":"video_aridome_1nen.mp4"},{"grade":1,"name":"三浦","file":"video_miura_1nen.mp4"},{"grade":2,"name":"井阪","file":"video_isaka_2nen.mp4"},{"grade":3,"name":"秋月","file":"video_akitsuki_3nen.mp4"},{"grade":3,"name":"麻","file":"video_asa_3nen.mp4"},{"grade":3,"name":"小谷","file":"video_kotani_3nen.mp4"},{"grade":3,"name":"眞保","file":"video_sanayasu_3nen.mp4"},{"grade":3,"name":"竹元","file":"video_takemoto_3nen.mp4"},{"grade":4,"name":"松浦","file":"video_matsuura_4nen.mp4"},{"grade":5,"name":"田原","file":"video_tahara_5nen.mp4"},{"grade":5,"name":"山本","file":"video_yamamoto_5nen.mp4"},{"grade":6,"name":"麻","file":"video_asa_6nen.mp4"},{"grade":6,"name":"石原","file":"video_ishihara_6nen.mp4"},{"grade":6,"name":"柏木","file":"video_kashiwagi_6nen.mp4"},{"grade":6,"name":"小関","file":"video_koseki_6nen.mp4"},{"grade":6,"name":"長田","file":"video_nagata_6nen.mp4"}];
const grades=document.getElementById('grades'),menu=document.getElementById('menu'),viewer=document.getElementById('viewer'),movie=document.getElementById('movie');
for(let g=1;g<=6;g++){
 const card=document.createElement('section');card.className='grade';const heading=document.createElement('div');heading.className='grade-head';heading.textContent=g+'年生';card.append(heading);const area=document.createElement('div');area.className='names';
 for(const s of students.filter(x=>x.grade===g)){const b=document.createElement('button');b.className='student';b.type='button';b.textContent=s.name;b.setAttribute('aria-label',g+'年生 '+s.name+'さんの作品');b.addEventListener('click',()=>show(s));area.append(b)}card.append(area);grades.append(card)
}
function show(s){movie.pause();movie.removeAttribute('src');movie.load();movie.src=encodeURI(s.file);viewer.hidden=false;viewer.classList.add('active');menu.hidden=true;movie.currentTime=0;movie.play().catch(()=>{movie.controls=true});history.replaceState(null,'','#'+s.file.replace('.mp4',''))}
function back(){movie.pause();movie.removeAttribute('src');movie.load();movie.controls=false;viewer.classList.remove('active');viewer.hidden=true;menu.hidden=false;history.replaceState(null,'',location.pathname+location.search)}
document.getElementById('back').addEventListener('click',back);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!viewer.hidden)back()});
</script></body></html>
